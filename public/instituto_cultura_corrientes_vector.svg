  <line x1="448" y1="402" x2="448" y2="415" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <line x1="408" y1="375" x2="421" y2="375" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <line x1="475" y1="375" x2="488" y2="375" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <line x1="420" y1="347" x2="429" y2="356" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <line x1="467" y1="394" x2="476" y2="403" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <line x1="420" y1="403" x2="429" y2="394" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
