  <path d="M 112 766 L 112 754 L 124 754" stroke="#000000" stroke-width="2.5" fill="none" />
  <path d="M 782 766 L 782 754 L 770 754" stroke="#000000" stroke-width="2.5" fill="none" />
  <path d="M 112 844 L 112 856 L 124 856" stroke="#000000" stroke-width="2.5" fill="none" />
  <path d="M 782 844 L 782 856 L 770 856" stroke="#000000" stroke-width="2.5" fill="none" />

